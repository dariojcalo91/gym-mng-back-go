version: "2"

formatters:
  enable:
    - gofmt

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - gocritic
  settings:
    gocritic:
      enabled-checks:
        - commentedOutCode
        - exitAfterDefer

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

issues:
  exclude:
    - path: cmd/client_test/
      linters:
        - errcheck
        - gocritic
        - staticcheck
    - path: "_test.go"
      linters:
        - errcheck
